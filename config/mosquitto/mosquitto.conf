# Palantír — broker MQTT
# Bus de messages entre Zigbee2MQTT et Home Assistant.

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice

# Aucun accès anonyme : tous les clients s'authentifient.
allow_anonymous false
password_file /mosquitto/config/passwd

listener 1883
protocol mqtt

listener 9001
protocol websockets

# Les messages retenus (retained) portent l'état courant des équipements :
# un client qui se reconnecte retrouve immédiatement l'état du parc.
max_queued_messages 10000
